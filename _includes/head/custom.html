<!-- start custom head snippets -->

<!-- 한글 웹폰트: Pretendard 동적 서브셋
     테마 기본 "Stylish" 는 로드되지 않아 Windows 에서 맑은 고딕으로 떨어졌다.
     동적 서브셋이라 실제 사용된 글자에 해당하는 woff2 조각만 내려받는다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 렌더 블로킹 회피: preload 후 onload 에서 stylesheet 로 승격.
     (as="style" 는 preload 에서만 의미가 있다 — rel="stylesheet" 에 붙여도 무시된다)
     폴백 스택이 OS별 한글 서체라 스왑 전에도 읽을 수 있다. -->
<link rel="preload" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</noscript>

<!-- favicon -->
<link rel="icon" type="image/jpeg" href="{{ '/assets/images/joonlab-logo.jpeg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/joonlab-logo.jpeg' | relative_url }}">
<meta name="theme-color" content="#a50034">

    {% include mathjax-support.html %}
{% endif %}

<!-- end custom head snippets -->
